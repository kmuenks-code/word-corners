<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Word Corners</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="board">
  <header id="top-bar">
    <!-- Filled in by js/main.js on every non-production deploy (see
         js/env.js). Left empty and hidden in markup so production never
         flashes a badge before the module runs. -->
    <span id="env-badge" hidden></span>
    <img id="game-logo" src="img/logo.png" alt="Word Corners">
    <div id="score-badge">
      <span id="score-label">Score</span>
      <span id="score-value">0</span>
    </div>
  </header>

  <!-- .corner-mark is filled with its shape's inline SVG by main.js at
       startup (renderCornerSymbol, js/ui.js) rather than hand-written per
       corner, so the badge and an objective row's leading symbol come from
       one art source — see js/cornerSymbols.js. -->
  <div class="corner" id="corner-nw" data-corner="nw">
    <span class="corner-mark"></span>
    <span class="word"></span>
  </div>
  <div class="corner" id="corner-ne" data-corner="ne">
    <span class="corner-mark"></span>
    <span class="word"></span>
  </div>
  <div class="corner" id="corner-sw" data-corner="sw">
    <span class="corner-mark"></span>
    <span class="word"></span>
  </div>
  <div class="corner" id="corner-se" data-corner="se">
    <span class="corner-mark"></span>
    <span class="word"></span>
  </div>

  <div id="center-stack">
    <div id="center-row">
      <div class="row-slot">
        <button id="undo-btn" type="button" aria-label="Undo" title="Undo" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
               stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.5 8.5h9a5.5 5.5 0 1 1 0 11H9"/>
            <path d="M8.5 4.5 4.5 8.5l4 4"/>
          </svg>
        </button>
        <span class="row-label">Undo</span>
      </div>

      <div class="row-slot">
        <div id="preview-bubble">
          <div id="preview-letter"></div>
        </div>
        <span class="row-label">Next</span>
      </div>

      <div class="row-slot choice-slot">
        <div class="choice-bubble" id="choice-0">
          <div class="choice-letter" id="choice-letter-0"></div>
        </div>
      </div>

      <div class="row-slot choice-slot">
        <div class="choice-bubble" id="choice-1">
          <div class="choice-letter" id="choice-letter-1"></div>
        </div>
      </div>

      <div class="row-slot" id="blank-slot" hidden>
        <div class="choice-bubble blank-bubble" id="blank-bubble">
          <svg class="blank-star" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
            <path d="M12 2.5l2.9 6.4 7 .8-5.3 4.8 1.5 6.9L12 17.9l-6.1 3.5 1.5-6.9-5.3-4.8 7-.8z"/>
          </svg>
        </div>
        <span class="row-label">Blank</span>
      </div>
    </div>
  </div>

  <!-- Idle: single-letter + hold flow this replaced. Not wired into the
       active game (see js/main.js); kept in case that flow is revisited. -->
  <div id="legacy-controls" hidden>
    <div id="next-letter-preview">
      <div id="next-letter"></div>
    </div>
    <div id="center">
      <div id="current-letter"></div>
    </div>
    <div id="hold-slot" class="empty" data-corner="hold">
      <div id="hold-letter"></div>
    </div>
  </div>

  <button id="hint-bar" type="button">
    <span id="hint-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9.5 18.5h5M10.5 21.5h3M12 2.5a7 7 0 0 0-4 12.8v2.2h8v-2.2a7 7 0 0 0-4-12.8z"/>
      </svg>
    </span>
    <span id="hint-text">How to Play</span>
  </button>

  <!-- Objective mode only: a flag tabbed onto the right edge, mid-board.
       main.js shows it when the chosen mode actually has objectives, and
       the badge tracks how many are done. Tapping opens #objective-panel. -->
  <button id="objective-flag" type="button" hidden aria-label="Objectives" title="Objectives">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
         stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 21V4"/>
      <path d="M6 4.5h11l-2.6 4 2.6 4H6z" fill="currentColor" stroke="none"/>
    </svg>
    <span id="objective-flag-badge">0/0</span>
  </button>

  <!-- Dismissible, unlike #blank-picker: this one is informational, so
       both the backdrop and the close button shut it. -->
  <div id="objective-panel" hidden>
    <div id="objective-panel-card">
      <div id="objective-panel-title">Objectives</div>
      <ul id="objective-list"></ul>
      <button id="objective-panel-close" type="button">Close</button>
    </div>
  </div>

  <div id="game-over">
    <div id="game-over-label">Game Over</div>
    <div id="final-score-row">Final Score: <span id="final-score">0</span></div>
    <!-- Objective mode only: the same list the flag panel shows, resolved
         to its final ✓/✗ state. Hidden (and empty) in Endless. -->
    <ul id="game-over-objectives" hidden></ul>
    <!-- Filled from the database at game over (see js/api.js). Hidden while
         the request is in flight, and stays hidden if it fails — the overlay
         degrades to just the final score. -->
    <dl id="best-scores">
      <div class="best-row" id="personal-best-row" hidden>
        <dt>Your Best</dt>
        <dd id="personal-best">—</dd>
      </div>
      <div class="best-row" id="global-best-row" hidden>
        <dt>All-Time Best</dt>
        <dd id="global-best">—</dd>
      </div>
    </dl>
    <button id="new-game-btn" type="button">New Game</button>
  </div>

  <div id="blank-picker" hidden>
    <div id="blank-picker-card">
      <div id="blank-picker-title">Choose a Letter</div>
      <div id="blank-picker-grid"></div>
    </div>
  </div>

  <!-- The opening screen, and where "New Game" returns to. Deliberately
       NOT hidden in markup: it covers the board from first paint, so the
       player never glimpses a live board before choosing a mode. Both
       button groups are built by js/ui.js from the mode and difficulty
       tables, so adding either shows up here with no markup change. -->
  <div id="splash">
    <!-- Outside the card on purpose: the logo art is light-on-teal, so it
         disappears against the card's cream and needs the teal backdrop. -->
    <img id="splash-logo" src="img/logo.png" alt="Word Corners">

    <div id="splash-card">
      <div class="splash-step" id="splash-modes">
        <div class="splash-step-title">Choose a Mode</div>
        <!-- Replaced by js/ui.js once the word list has loaded, so the
             first tap can't start a game whose word checks would throw. -->
        <div id="splash-mode-options"><div class="splash-loading">Loading…</div></div>
      </div>

      <div class="splash-step" id="splash-difficulty" hidden>
        <div class="splash-step-title">Choose a Difficulty</div>
        <div id="splash-difficulty-options"></div>
        <button id="splash-back" type="button">Back</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
