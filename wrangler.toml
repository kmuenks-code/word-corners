# Cloudflare Worker configuration.
#
# One Worker serves both the game and the API: `public/` is uploaded as
# static assets, and src/index.js handles the /api routes. Assets are
# matched before the Worker runs, so the Worker only sees /api/* and 404s.
#
# Anything outside `public/` — this file, db/, src/, CLAUDE.md, .claude/ —
# is never served to the browser.

name = "word-corners"
main = "src/index.js"
compatibility_date = "2026-08-16"

[assets]
directory = "./public"
binding = "ASSETS"

# D1 (Cloudflare's SQLite). Schema lives in db/schema.sql.
[[d1_databases]]
binding = "DB"
database_name = "word-corners"
database_id = "809a1ff5-34fd-4a0e-b95e-07e796a75fa5"
