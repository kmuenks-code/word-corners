<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Word Corners</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="board">
  <div class="corner" id="corner-nw" data-corner="nw">
    <span class="word"></span>
  </div>
  <div class="corner" id="corner-ne" data-corner="ne">
    <span class="word"></span>
  </div>
  <div class="corner" id="corner-sw" data-corner="sw">
    <span class="word"></span>
  </div>
  <div class="corner" id="corner-se" data-corner="se">
    <span class="word"></span>
  </div>

  <div id="center-stack">
    <div id="score-display">Score: <span id="score-value">0</span></div>

    <div id="center-row">
      <button id="undo-btn" type="button" aria-label="Undo" title="Undo" disabled>&#8630;</button>

      <div id="next-letter-preview">
        <div id="next-letter"></div>
      </div>

      <div id="center">
        <div id="current-letter"></div>
      </div>

      <div id="hold-section">
        <div id="hold-label">Hold</div>
        <div id="hold-slot" class="empty" data-corner="hold">
          <div id="hold-letter"></div>
        </div>
      </div>

      <div class="center-row-spacer" aria-hidden="true"></div>
    </div>
  </div>

  <div id="game-over">
    <div id="game-over-label">Game Over</div>
    <div id="final-score-row">Final Score: <span id="final-score">0</span></div>
    <button id="new-game-btn" type="button">New Game</button>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
